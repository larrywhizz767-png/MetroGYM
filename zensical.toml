[project]
site_name = "MetroGYM"
site_url = "https://metrogym.readthedocs.io/"
site_author = "MetroGYM"
site_description = """
MetroGYM is a pure Python library for building metro simulations from explicit
primitives, then driving those worlds with typed train and signal solvers.
"""
copyright = "MetroGYM documentation"
repo_url = "https://github.com/larrywhizz767-png/MetroGYM"
repo_name = "larrywhizz767-png/MetroGYM"
edit_uri = "edit/main/docs/"
nav = [
    { "Home" = "index.md" },
    { "Get Started" = [
        { "Get started" = "getting-started/index.md" },
        { "First Example" = "getting-started/first-example.md" },
        { "Related Work" = "getting-started/related-work.md" },
        { "What's Next" = "getting-started/whats-next.md" },
    ]},
    { "Tutorials" = [
        { "Overview" = "tutorials/overview.md" },
        { "Building worlds" = "tutorials/building-worlds.md" },
        { "Controlling trains" = "tutorials/controlling-trains.md" },
        { "Managing signals" = "tutorials/managing-signals.md" },
        { "Advanced scenarios" = "tutorials/advanced-scenarios.md" },
    ]},
    { "Puzzles" = [
        { "Overview" = "puzzles/index.md" },
        { "Basic" = [
            { "01 · Linear Search" = "puzzles/basic/01-linear-search.md" },
            { "02 · Binary Search" = "puzzles/basic/02-binary-search.md" },
        ]},
        { "Medium" = [
            { "01 · Depth-first search" = "puzzles/medium/01-depth-first-search.md" },
            { "02 · Breadth-first search" = "puzzles/medium/02-breadth-first-search.md" },
        ]},
        { "Advanced" = [
            { "01 · Fastest route" = "puzzles/advanced/01-fastest-route.md" },
            { "02 · Transfer-aware routing" = "puzzles/advanced/02-transfer-aware-routing.md" },
            { "03 · Larger-city BFS" = "puzzles/advanced/03-larger-city-bfs.md" },
        ]},
    ]},
    { "API" = [
        "API/index.md",
        { "Foundations" = [
            { "Metro system" = "API/foundations/metro-system.md" },
            { "Colors and positions" = "API/foundations/colors-and-positions.md" },
        ]},
        { "Primitives" = [
            { "Network" = "API/primitives/network.md" },
            { "Trains" = "API/primitives/trains.md" },
            { "Signals" = "API/primitives/signals.md" },
        ]},
        { "Solvers" = [
            { "World views and decisions" = "API/solvers/world-views-and-decisions.md" },
            { "Train solvers" = "API/solvers/train-solvers.md" },
            { "Signal solvers" = "API/solvers/signal-solvers.md" },
        ]},
        { "Rendering" = [
            { "Renderers" = "API/rendering/renderer-primitive.md" },
        ]},
    ]},
    { "Community Hub" = [
        { "Overview" = "community-hub.md" },
        { "Branding" = "branding.md" },
        { "Developers" = "developers.md" },
        { "FAQ" = "faq.md" },
    ]},
]
extra_css = [
    "stylesheets/extra.css",
    "stylesheets/lucide-icons.css",
    "stylesheets/landing.css",
    "stylesheets/theme-refresh.css",
]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://polyfill-fastly.io/v3/polyfill.min.js?features=es6",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
    "javascripts/api-nav-icons.js",
    "javascripts/search-shortcut.js",
    "javascripts/homepage.js",
]

[project.theme]
variant = "modern"
custom_dir = "docs/overrides"
favicon = "assets/images/favicon/favicon.ico"
logo = "assets/images/favicon/favicon-256x256.png"
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "simple/github"
edit = "lucide/pencil"
view = "lucide/eye"

[project.theme.font]
text = "Space Grotesk"
code = "IBM Plex Mono"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/larrywhizz767-png/MetroGYM"
name = "MetroGYM on GitHub"

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
heading_level = 3
show_source = true
show_root_heading = true
show_root_full_path = false

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.meta]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

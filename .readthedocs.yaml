version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - python -m pip install uv==0.10.10
      # Install the package and documentation tools from the committed lockfile.
      - python -m uv sync --locked --group docs
    build:
      html:
        - python -m uv run --no-sync zensical build
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html"
      - cp -a site/. "$READTHEDOCS_OUTPUT/html/"

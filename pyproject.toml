[project]
name = "metrogym"
version = "0.1.0"
description = "Build and control metro simulations with explicit, typed pipelines."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Larry Lin" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["metro", "simulation", "education", "pygame", "transport"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "beartype>=0.22.9",
    "pygame>=2.6.1",
]

[project.urls]
Documentation = "https://metrogym.readthedocs.io/en/latest/"
Source = "https://github.com/larrywhizz767-png/MetroGYM"
Issues = "https://github.com/larrywhizz767-png/MetroGYM/issues"
Releases = "https://github.com/larrywhizz767-png/MetroGYM/releases"

[project.optional-dependencies]
llm = [
    "ell-ai[all]>=0.0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/metrogym", "pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/metrogym"]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=0.25",
    "mkdocstrings-python>=1.16.10",
    "pymdown-extensions>=10.14.3",
    "zensical>=0.0.33",
]

[tool.uv]
package = true

[project]
name = "metrogym"
version = "0.1.0"
description = "Pure Python pygame MetroGYM teaching library."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "MetroGYM" }]
license = { text = "MIT" }
dependencies = [
    "beartype>=0.22.9",
    "pygame>=2.6.1",
]

[project.optional-dependencies]
llm = [
    "ell-ai[all]>=0.0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrogym"]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=0.25",
    "mkdocstrings-python>=1.16.10",
    "pymdown-extensions>=10.14.3",
    "zensical>=0.0.33",
]

[tool.uv]
package = true

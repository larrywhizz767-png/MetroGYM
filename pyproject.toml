[project]
name = "metrogym"
version = "0.1.0"
description = "Pure Python pygame MetroGYM teaching library."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "MetroGYM" }]
license = { text = "MIT" }
dependencies = [
    "beartype>=0.22.9",
    "pygame>=2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrogym"]

[tool.uv]
package = true
